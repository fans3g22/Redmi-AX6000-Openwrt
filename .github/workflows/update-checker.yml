#
# Description: Automatically check for upstream ImmortalWrt, Honk, and MosDNS updates and trigger build
#

name: Update Checker

on:
  workflow_dispatch:
  schedule:
    # 每天北京时间凌晨 04:00 (UTC 20:00) 自动检查
    - cron: '0 20 * * *'

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Check updates for Honk, MosDNS, and ImmortalWrt
      id: getHash
      run: |
        # 1. 自动从 build-openwrt.yml 读取当前固件所用的上游分支（无论配置为 25.12 还是 master）
        UPSTREAM_BRANCH=$(grep 'REPO_BRANCH:' .github/workflows/build-openwrt.yml | head -1 | awk '{print $2}')
        [ -z "$UPSTREAM_BRANCH" ] && UPSTREAM_BRANCH="openwrt-25.12"

        UPSTREAM_URL="https://github.com/immortalwrt/immortalwrt"
        HONK_URL="https://github.com/kenzok8/openwrt-honk"

        echo "🔍 开始检测上游及核心插件最新版本..."

        # 2. 秒级获取核心源的最新 Commit Hash
        UPSTREAM_HASH=$(git ls-remote "$UPSTREAM_URL" "refs/heads/$UPSTREAM_BRANCH" | awk '{print $1}')
        # 若指定分支未取到则回退至 HEAD
        [ -z "$UPSTREAM_HASH" ] && UPSTREAM_HASH=$(git ls-remote "$UPSTREAM_URL" HEAD | awk '{print $1}')

        HONK_HASH=$(git ls-remote "$HONK_URL" HEAD | awk '{print $1}')

        echo "---------------------------------------------------------"
        echo "🚀 Honk (openwrt-honk)      : $HONK_HASH"
        echo "📦 ImmortalWrt ($UPSTREAM_BRANCH): $UPSTREAM_HASH"
        echo "---------------------------------------------------------"

        if [ -z "$HONK_HASH" ] || [ -z "$UPSTREAM_HASH" ]; then
          echo "❌ 获取某些源的 Commit Hash 失败，请检查网络！"
          exit 1
        fi

        # 3. 生成多源联合指纹：Honk、ImmortalWrt 任何一个更新，指纹均会发生改变
        COMPOSITE_HASH=$(echo "IMMORTALWRT=${UPSTREAM_HASH};HONK=${HONK_HASH}" | sha256sum | awk '{print $1}')
        echo "compositeHash=$COMPOSITE_HASH" >> "$GITHUB_OUTPUT"
        echo "🔑 当前联合指纹: $COMPOSITE_HASH"

    - name: Compare with cached fingerprint
      id: cacheHash
      uses: actions/cache@v4
      with:
        path: .commitHash
        key: composite-update-${{ steps.getHash.outputs.compositeHash }}

    - name: Save new fingerprint
      if: steps.cacheHash.outputs.cache-hit != 'true'
      run: |
        echo "✨ 检测到新更新（Honk、MosDNS 或 ImmortalWrt 发生变动），准备触发构建！"
        echo "${{ steps.getHash.outputs.compositeHash }}" > .commitHash

    - name: Trigger build workflow
      if: steps.cacheHash.outputs.cache-hit != 'true'
      uses: peter-evans/repository-dispatch@v3
      with:
        token: ${{ secrets.ACTIONS_TRIGGER_PAT || secrets.GITHUB_TOKEN }}
        event-type: source-code-update
        client-payload: '{"composite": "${{ steps.getHash.outputs.compositeHash }}"}'

    - name: Workflow dispatch fallback
      if: steps.cacheHash.outputs.cache-hit != 'true'
      env:
        GH_TOKEN: ${{ secrets.ACTIONS_TRIGGER_PAT || secrets.GITHUB_TOKEN }}
      run: |
        gh workflow run build-openwrt.yml --ref main || true
