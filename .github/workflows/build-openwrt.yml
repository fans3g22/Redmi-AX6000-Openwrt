name: Build ImmortalWrt for Redmi AX6000

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'ImmortalWrt branch/tag'
        required: true
        default: 'master'
      target:
        description: 'OpenWrt target'
        required: true
        default: 'mediatek/filogic'
      profile:
        description: 'Device profile'
        required: true
        default: 'xiaomi_redmi-router-ax6000-stock'

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout your config repo
        uses: actions/checkout@v4
        with:
          path: config-repo

      - name: Checkout ImmortalWrt source
        uses: actions/checkout@v4
        with:
          repository: immortalwrt/immortalwrt
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 0
          path: immortalwrt

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev \
            libssl-dev python3-dev python3-distutils python3-setuptools \
            rsync unzip zlib1g-dev file wget curl

      - name: Add custom package feeds
        working-directory: immortalwrt
        run: |
          # nikki / momo: proxy plugins
          echo 'src-git nikki https://github.com/nikkinikki-org/OpenWrt-nikki.git;main' >> feeds.conf.default
          echo 'src-git momo https://github.com/nikkinikki-org/OpenWrt-momo.git;main' >> feeds.conf.default
          # mosdns: DNS forwarding/forwarder
          echo 'src-git mosdns https://github.com/sbwml/luci-app-mosdns.git;main' >> feeds.conf.default
          # kenzo / small: popular OpenWrt package collections
          echo 'src-git kenzo https://github.com/kenzok8/openwrt-packages.git;main' >> feeds.conf.default
          echo 'src-git small https://github.com/kenzok8/small.git;main' >> feeds.conf.default
          # helloworld: SSR Plus+
          echo 'src-git helloworld https://github.com/fw876/helloworld.git;main' >> feeds.conf.default

      - name: Update and install feeds
        working-directory: immortalwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Copy .config and expand
        working-directory: immortalwrt
        run: |
          cp $GITHUB_WORKSPACE/config-repo/.config .config
          make defconfig

      - name: Download package sources
        working-directory: immortalwrt
        run: |
          make download -j$(nproc)
          find dl -size -1024c -exec ls -l {} \;

      - name: Compile firmware
        working-directory: immortalwrt
        run: make -j$(nproc) V=s

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-ax6000-stock
          path: |
            immortalwrt/bin/targets/mediatek/filogic/
            !immortalwrt/bin/targets/mediatek/filogic/packages/
