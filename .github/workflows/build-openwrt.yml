name: Build ImmortalWrt for Redmi AX6000

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "ImmortalWrt commit or tag"
        required: true
        default: "313718c25f206cdeee399bdc6c002b7388c9a513"
      include_router_config:
        description: "Restore the encrypted router snapshot"
        required: true
        type: boolean
        default: true

env:
  TZ: Asia/Shanghai
  DEFAULT_SOURCE_REF: "313718c25f206cdeee399bdc6c002b7388c9a513"

permissions:
  contents: read

jobs:
  build-stock:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout configuration repository
        uses: actions/checkout@v4
        with:
          path: config-repo

      - name: Checkout ImmortalWrt source
        uses: actions/checkout@v4
        with:
          repository: immortalwrt/immortalwrt
          ref: ${{ github.event.inputs.source_ref || env.DEFAULT_SOURCE_REF }}
          fetch-depth: 0
          path: immortalwrt

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev \
            libssl-dev python3-dev python3-distutils python3-setuptools \
            rsync unzip zlib1g-dev file wget curl

      - name: Pin feeds to the captured firmware build
        working-directory: immortalwrt
        run: |
          cat > feeds.conf.default <<'EOF'
          src-git packages https://github.com/immortalwrt/packages.git^8c55f325c98f8ef09906fce123e83314f02470ee
          src-git luci https://github.com/immortalwrt/luci.git^2858f8d98b270bd3baf30a1d19c6e26df22c3197
          src-git routing https://github.com/openwrt/routing.git^cc66db23430a923df3fe7941a097c5fd4040087b
          src-git telephony https://github.com/openwrt/telephony.git^2618106d5846a4a542fdf5809f0d3ed228ce439b
          src-git video https://github.com/openwrt/video.git^094bf58da6682f895255a35a84349a79dab4bf95
          src-git extras https://github.com/immortalwrt/packages.git^f3355492bd38b6e40afbb1cad9307c43bf4d843e
          src-git momo https://github.com/nikkinikki-org/OpenWrt-momo.git^dc0b315030aff15687829e3c411421299d32298a
          src-git mosdns https://github.com/sbwml/luci-app-mosdns.git^fae49a28404a7cee309b47fccd920c3da7e81c2e
          src-git small https://github.com/kenzok8/small.git^3a03f66d706885bf4a35d9ac04c08b2d51593f55
          EOF

      - name: Update and install feeds
        working-directory: immortalwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a -p packages
          ./scripts/feeds install -a -p luci
          ./scripts/feeds install -p extras 3proxy
          ./scripts/feeds install -p momo luci-app-momo momo
          ./scripts/feeds install -p mosdns mosdns
          ./scripts/feeds install -p small mihomo

      - name: Apply captured package selection
        working-directory: immortalwrt
        run: |
          cp "$GITHUB_WORKSPACE/config-repo/.config" .config

          while IFS= read -r package_name; do
            [ -z "$package_name" ] && continue
            case "$package_name" in \#*) continue ;; esac
            policy_name="${package_name//./\\\\.}"
            sed -i "/^CONFIG_PACKAGE_${policy_name}=/d" .config
            printf 'CONFIG_PACKAGE_%s=y\n' "$package_name" >> .config
          done < "$GITHUB_WORKSPACE/config-repo/build-packages.txt"

          make defconfig

      - name: Verify profile and required packages
        working-directory: immortalwrt
        run: |
          set -eu
          grep -qx 'CONFIG_TARGET_mediatek_filogic_DEVICE_xiaomi_redmi-router-ax6000-stock=y' .config

          for package_name in \
            3proxy bridger dnsmasq-full luci-app-momo luci-app-statistics \
            mihomo momo mosdns sing-box; do
            grep -qx "CONFIG_PACKAGE_${package_name}=y" .config || {
              echo "Required package was not selected: ${package_name}"
              exit 1
            }
          done

      - name: Install public file overlay
        working-directory: immortalwrt
        run: |
          mkdir -p files
          cp -a "$GITHUB_WORKSPACE/config-repo/files/." files/

      - name: Restore encrypted router snapshot
        if: ${{ github.event.inputs.include_router_config != 'false' }}
        working-directory: immortalwrt
        env:
          ROUTER_CONFIG_ARCHIVE_PASSWORD: ${{ secrets.ROUTER_CONFIG_ARCHIVE_PASSWORD }}
        run: |
          set -eu
          if [ -z "${ROUTER_CONFIG_ARCHIVE_PASSWORD:-}" ]; then
            echo "ROUTER_CONFIG_ARCHIVE_PASSWORD is not configured."
            echo "Add the password as a repository Actions secret, or run with include_router_config=false."
            exit 1
          fi

          archive="$GITHUB_WORKSPACE/config-repo/configs/router-backup-2026-10-29.tar.gz.enc"
          plain_archive="$RUNNER_TEMP/router-backup.tar.gz"

          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 \
            -in "$archive" \
            -out "$plain_archive" \
            -pass env:ROUTER_CONFIG_ARCHIVE_PASSWORD

          if tar -tzf "$plain_archive" | grep -Ev '^etc/'; then
            echo "Unexpected path in router snapshot"
            exit 1
          fi

          tar -xzf "$plain_archive" -C files \
            --exclude='etc/momo/run/cache.db' \
            --exclude='etc/urandom.seed' \
            --exclude='etc/passwd-' \
            --exclude='etc/shadow-' \
            --exclude='etc/mosdns/config.yaml.bak-*' \
            --exclude='etc/mosdns/config.yaml.before-apply'
          rm -f "$plain_archive"

      - name: Download package sources
        working-directory: immortalwrt
        run: |
          make download -j"$(nproc)"
          find dl -size -1024c -exec ls -l {} \;

      - name: Compile stock firmware
        working-directory: immortalwrt
        run: make -j"$(nproc)" V=s

      - name: Verify artifacts and package manifest
        working-directory: immortalwrt
        run: |
          set -eu
          for artifact_file in \
            bin/targets/mediatek/filogic/*ax6000-stock-initramfs-factory.ubi \
            bin/targets/mediatek/filogic/*ax6000-stock-squashfs-sysupgrade.bin; do
            ls $artifact_file >/dev/null 2>&1 || {
              echo "Missing artifact: $artifact_file"
              exit 1
            }
          done

          test -n "$(find bin/targets/mediatek/filogic -maxdepth 1 -name '*.manifest' -print -quit)"

          for package_name in 3proxy bridger dnsmasq-full luci-app-momo luci-app-statistics mihomo momo mosdns sing-box; do
            grep -Rqs -E "^${package_name}([[:space:]]|$)" bin/targets/mediatek/filogic/*.manifest || {
              echo "Package missing from firmware manifest: ${package_name}"
              exit 1
            }
          done

          cp "$GITHUB_WORKSPACE/config-repo/manifests/installed-packages.tsv" \
            bin/targets/mediatek/filogic/ROUTER-SNAPSHOT-installed-packages.tsv
          cp "$GITHUB_WORKSPACE/config-repo/manifests/device-snapshot.md" \
            bin/targets/mediatek/filogic/ROUTER-SNAPSHOT-device-info.md
          cp .config bin/targets/mediatek/filogic/ROUTER-SNAPSHOT.config

          cd bin/targets/mediatek/filogic
          sha256sum \
            *ax6000-stock*.bin \
            *ax6000-stock*.ubi \
            *.manifest \
            ROUTER-SNAPSHOT-* > SHA256SUMS

      - name: Upload stock firmware
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-ax6000-stock-current-router
          path: immortalwrt/bin/targets/mediatek/filogic/
          if-no-files-found: error
